name: WorryStone
options:
  bundleIdPrefix: com.worrystone
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

targets:
  WorryStone:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Assets.xcassets
      - path: Sources/stone.usdz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worrystone.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets: []
